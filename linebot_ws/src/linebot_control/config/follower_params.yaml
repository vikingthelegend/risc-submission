line_detector:
  ros__parameters:
    image_topic: /camera/image_raw
    state_topic: /line/state
    publish_debug: true
    show_window: false
    # Region of interest (fractions of image height). Bottom = near the robot.
    roi_top: 0.35
    roi_bottom: 1.0
    # One weight per horizontal slice, NEAREST FIRST. Length = number of slices.
    # More weight on far slices = anticipates curves, but cuts corners.
    slice_weights: [0.5, 0.3, 0.2]
    threshold_mode: fixed          # fixed | otsu | adaptive
    threshold: 80                  # 0-255, darker than this = line (mode: fixed)
    blur_kernel: 5
    morph_kernel: 5
    min_area: 120.0
    max_slice_jump: 0.30

line_follower:
  ros__parameters:
    state_topic: /line/state
    cmd_vel_topic: /cmd_vel
    enabled: true
    # PID: normalised error [-1,1] -> angular velocity [rad/s]
    kp: 2.0
    ki: 0.0
    kd: 0.2
    i_limit: 1.0
    d_filter: 0.7
    max_angular: 2.0
    # Speed scheduling
    max_speed: 0.25
    min_speed: 0.08
    slow_gain: 0.6
    # Line lost behaviour
    lost_hold_time: 0.25
    lost_search_angular: 0.8
    lost_stop_after: 8.0
